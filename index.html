<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Changer - محوّل الصوت</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #f0f0f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.app { width: 100%; max-width: 480px; }
h1 { text-align: center; font-size: 20px; font-weight: 600; margin-bottom: 4px; color: #fff; }
.sub { text-align: center; font-size: 13px; color: #888; margin-bottom: 24px; }
.card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px; padding: 1.25rem; margin-bottom: 14px; }
.card-title { font-size: 11px; font-weight: 600; color: #666; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 12px; }
.presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.preset { padding: 10px 6px; border: 1px solid #2a2a2a; border-radius: 10px; background: #222; cursor: pointer; text-align: center; transition: all 0.15s; }
.preset:hover { background: #2a2a2a; }
.preset.active { border-color: #e056a0; background: #2a1020; }
.preset .em { font-size: 20px; display: block; margin-bottom: 3px; }
.preset .nm { font-size: 12px; font-weight: 600; color: #eee; }
.preset .ds { font-size: 10px; color: #777; }
.row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.row:last-child { margin-bottom: 0; }
.lbl { font-size: 12px; color: #888; min-width: 80px; }
input[type=range] { flex: 1; accent-color: #e056a0; height: 4px; }
.val { font-size: 12px; font-weight: 600; color: #eee; min-width: 38px; text-align: left; }
.big-btn { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #e056a0; background: #2a1020; cursor: pointer; font-size: 30px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; margin: 0 auto; }
.big-btn:hover { transform: scale(1.06); }
.big-btn.on { background: #e056a0; border-color: #e056a0; animation: glow 1.4s ease-in-out infinite; }
@keyframes glow { 0%,100%{box-shadow:0 0 0 0 rgba(224,86,160,0.4)} 50%{box-shadow:0 0 0 16px rgba(224,86,160,0)} }
.status-text { text-align: center; font-size: 13px; color: #888; margin-top: 10px; }
.viz { display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 36px; margin: 10px 0; }
.bar { width: 5px; border-radius: 3px; background: #e056a0; min-height: 3px; transition: height 0.06s; opacity: 0.8; }
.note { background: #111; border: 1px solid #2a2a2a; border-radius: 8px; padding: 8px 12px; font-size: 11px; color: #666; line-height: 1.6; margin-top: 6px; }
.note b { color: #e056a0; }
.loading { text-align: center; padding: 20px; color: #888; font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <h1>🎤 محوّل الصوت</h1>
  <p class="sub">غيّر صوتك لصوت بنت — Real Time</p>

  <div class="card">
    <div class="card-title">اختر النمط</div>
    <div class="presets" id="presets">
      <div class="preset active" data-pitch="8" onclick="pickPreset(this)">
        <span class="em">👧</span><div class="nm">طفولي</div><div class="ds">+8 نغمات</div>
      </div>
      <div class="preset" data-pitch="5" onclick="pickPreset(this)">
        <span class="em">👩</span><div class="nm">شابة</div><div class="ds">+5 نغمات</div>
      </div>
      <div class="preset" data-pitch="7" onclick="pickPreset(this)">
        <span class="em">🌸</span><div class="nm">ناعم</div><div class="ds">+7 نغمات</div>
      </div>
      <div class="preset" data-pitch="10" onclick="pickPreset(this)">
        <span class="em">✨</span><div class="nm">أنمي</div><div class="ds">+10 نغمات</div>
      </div>
      <div class="preset" data-pitch="4" onclick="pickPreset(this)">
        <span class="em">💼</span><div class="nm">رسمية</div><div class="ds">+4 نغمات</div>
      </div>
      <div class="preset" data-pitch="0" onclick="pickPreset(this)">
        <span class="em">🎙️</span><div class="nm">أصلي</div><div class="ds">0 نغمة</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">ضبط يدوي</div>
    <div class="row">
      <span class="lbl">طبقة الصوت</span>
      <input type="range" id="sl-pitch" min="-12" max="12" step="1" value="8" oninput="setPitch(+this.value)">
      <span class="val" id="vl-pitch">+8</span>
    </div>
    <div class="row">
      <span class="lbl">صدى</span>
      <input type="range" id="sl-rev" min="0" max="0.6" step="0.05" value="0.1" oninput="setReverb(+this.value)">
      <span class="val" id="vl-rev">10%</span>
    </div>
    <div class="row">
      <span class="lbl">مستوى</span>
      <input type="range" id="sl-vol" min="0" max="2" step="0.1" value="1" oninput="setVolume(+this.value)">
      <span class="val" id="vl-vol">100%</span>
    </div>
  </div>

  <div class="card" style="text-align:center;">
    <div class="viz" id="viz">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
    <button class="big-btn" id="mainBtn" onclick="toggle()">🎤</button>
    <div class="status-text" id="statusTxt">اضغط للبدء</div>
    <div class="note" style="margin-top:12px;">
      <b>⚠️ مهم:</b> استخدم <b>سماعة أذن</b> لتجنب الصدى. الصوت المعدّل يخرج من السماعة مباشرة.
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
<script>
let mic, pitchShift, reverb, vol, analyser, meter;
let running = false;
let animId;
let currentPitch = 8;
let currentReverb = 0.1;
let currentVol = 1;

function pickPreset(el) {
  document.querySelectorAll('.preset').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  const p = +el.dataset.pitch;
  currentPitch = p;
  document.getElementById('sl-pitch').value = p;
  document.getElementById('vl-pitch').textContent = (p >= 0 ? '+' : '') + p;
  if (pitchShift) pitchShift.pitch = p;
}

function setPitch(v) {
  currentPitch = v;
  document.getElementById('vl-pitch').textContent = (v >= 0 ? '+' : '') + v;
  if (pitchShift) pitchShift.pitch = v;
  // sync preset highlight
  document.querySelectorAll('.preset').forEach(p => {
    p.classList.toggle('active', +p.dataset.pitch === v);
  });
}

function setReverb(v) {
  currentReverb = v;
  document.getElementById('vl-rev').textContent = Math.round(v * 100) + '%';
  if (reverb) reverb.wet.value = v;
}

function setVolume(v) {
  currentVol = v;
  document.getElementById('vl-vol').textContent = Math.round(v * 100) + '%';
  if (vol) vol.volume.value = Tone.gainToDb(v);
}

async function toggle() {
  if (running) { await stopChain(); return; }
  await startChain();
}

async function startChain() {
  const btn = document.getElementById('mainBtn');
  const txt = document.getElementById('statusTxt');
  txt.textContent = '⏳ يجهّز الميكروفون...';

  try {
    await Tone.start();

    mic = new Tone.UserMedia();
    await mic.open();

    pitchShift = new Tone.PitchShift({
      pitch: currentPitch,
      windowSize: 0.1,
      delayTime: 0,
      feedback: 0
    });

    reverb = new Tone.Reverb({ decay: 1.2, wet: currentReverb });
    await reverb.ready;

    vol = new Tone.Volume(Tone.gainToDb(currentVol));

    analyser = new Tone.Analyser('waveform', 32);

    mic.connect(pitchShift);
    pitchShift.connect(reverb);
    reverb.connect(vol);
    vol.connect(analyser);
    vol.toDestination();

    running = true;
    btn.classList.add('on');
    btn.textContent = '⏹';
    txt.textContent = '🎙️ يعمل — تكلم الآن!';
    startViz();
  } catch(e) {
    txt.textContent = '❌ ' + (e.message || 'تعذّر الوصول للميكروفون');
  }
}

async function stopChain() {
  cancelAnimationFrame(animId);
  if (mic) mic.close();
  if (pitchShift) pitchShift.dispose();
  if (reverb) reverb.dispose();
  if (vol) vol.dispose();
  if (analyser) analyser.dispose();
  mic = pitchShift = reverb = vol = analyser = null;
  running = false;
  document.getElementById('mainBtn').classList.remove('on');
  document.getElementById('mainBtn').textContent = '🎤';
  document.getElementById('statusTxt').textContent = 'اضغط للبدء';
  document.querySelectorAll('#viz .bar').forEach(b => b.style.height = '3px');
}

function startViz() {
  const bars = document.querySelectorAll('#viz .bar');
  function draw() {
    animId = requestAnimationFrame(draw);
    if (!analyser) return;
    const data = analyser.getValue();
    bars.forEach((b, i) => {
      const v = Math.abs(data[i] || 0);
      b.style.height = Math.max(3, v * 120) + 'px';
    });
  }
  draw();
}
</script>
</body>
</html>
